{% extends "base.html" %}
{% block content %}
<section class="reset-password-page">

    {% if token %}
    <form class="reset-password" action="reset-password" method="post">

        <input type="hidden" value="{{ token }}" name="token">

        <label for="reset-password">New Password:</label>
        <input type="password" id="reset-password" name="new_password" placeholder="Enter new password" required>

        <label for="reset-password-conf">Confirm New Password:</label>
        <input type="password" id="reset-password" name="conf_new_password" placeholder="Confirm password" required>
        
        <button type="submit">Change Password</button>

    </form>
    {% endif %}

    {% if error %}
    <p class="reset-password-error">{{ error }}</p>
    {% endif %}

</section>

 
{% endblock %}
